<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Job Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6D5DFC;
            --primary-dark: #5B4FE0;
            --primary-light: #EEEBFF;
            --bg: #F6F6FB;
            --card: #FFFFFF;
            --text: #1F2333;
            --text-soft: #6B7280;
            --border: #E7E7F1;
            --success-bg: #DCFCE7;
            --success-text: #16A34A;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 2px rgba(20,20,50,0.04), 0 4px 16px rgba(20,20,50,0.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        a { text-decoration: none; color: inherit; }
        .topnav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 48px; background: var(--card); border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
        .brand-dot { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), #A78BFA); }
        .nav-links { display: flex; align-items: center; gap: 32px; }
        .nav-links a.link { color: var(--text-soft); font-weight: 500; font-size: 14px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px;
            border: none; cursor: pointer; transition: background .15s ease;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-block { width: 100%; }
        .container-page { max-width: 1100px; margin: 0 auto; padding: 48px 24px; }
        .card { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 32px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-success { background: var(--success-bg); color: var(--success-text); }
        .badge-soft { background: var(--primary-light); color: var(--primary); }
        .alert { padding: 14px 18px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 14px; }
        .alert-success { background: #DCFCE7; color: #166534; }
        .alert-error, .alert-danger { background: #FEE2E2; color: #991B1B; }
        .alert-warning { background: #FEF3C7; color: #92400E; }
        input, textarea, select {
            width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); font-family: inherit; font-size: 14px;
            background: #FBFBFE;
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
        label { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block; }
        p.helptext { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
        ul.errorlist { color: #DC2626; font-size: 12px; padding-left: 18px; margin: 4px 0; }
    </style>
</head>
<body>
    <nav class="topnav">
        <a href="{% url 'home' %}" class="brand">
            <span class="brand-dot"></span> AI Job Tracker
        </a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'job_matches' %}" class="link">Job Matches</a>
                <a href="{% url 'profile_edit' %}" class="link">Profile</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="link">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container-page">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-danger{% else %}alert-warning{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
