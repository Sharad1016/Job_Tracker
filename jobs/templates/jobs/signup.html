{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; justify-content:center; gap:56px; flex-wrap:wrap; padding:24px 0;">

    <div style="text-align:center; max-width:280px;">
        <svg viewBox="0 0 200 200" width="220" height="220">
            <rect x="30" y="20" width="140" height="160" rx="16" fill="#EEEBFF"/>
            <rect x="50" y="45" width="100" height="10" rx="5" fill="#C7BFFF"/>
            <circle cx="100" cy="90" r="24" fill="#6D5DFC"/>
            <path d="M88 90a12 12 0 1 1 24 0" stroke="white" stroke-width="4" fill="none"/>
            <circle cx="100" cy="82" r="6" fill="white"/>
            <rect x="70" y="125" width="60" height="8" rx="4" fill="#C7BFFF"/>
            <rect x="80" y="140" width="40" height="8" rx="4" fill="#DCD7FF"/>
            <circle cx="150" cy="150" r="20" fill="#6D5DFC"/>
            <path d="M143 150h14M150 143v14" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <p style="font-weight:700; font-size:18px; margin-top:8px;">One step closer to<br>your dream job ✨</p>
    </div>

    <div class="card" style="width:380px;">
        <h1 style="font-size:22px; margin:0 0 4px;">Create Account 🚀</h1>
        <p style="color:var(--text-soft); font-size:14px; margin-bottom:24px;">Join us and start your job search journey</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Sign Up</button>
        </form>
        <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-soft);">
            Already have an account? <a href="{% url 'login' %}" style="color:var(--primary); font-weight:600;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
