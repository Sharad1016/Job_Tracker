{% if page_obj.paginator.num_pages > 1 %}
<div style="display:flex; justify-content:center; align-items:center; gap:16px; margin-top:24px;">
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value|urlencode }}{% endif %}{% endfor %}" class="btn btn-outline" style="padding:8px 18px; font-size:13px;">← Previous</a>
    {% else %}
        <span class="btn btn-outline" style="padding:8px 18px; font-size:13px; opacity:0.4; cursor:default;">← Previous</span>
    {% endif %}

    <span style="color:var(--text-soft); font-size:13px;">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value|urlencode }}{% endif %}{% endfor %}" class="btn btn-outline" style="padding:8px 18px; font-size:13px;">Next →</a>
    {% else %}
        <span class="btn btn-outline" style="padding:8px 18px; font-size:13px; opacity:0.4; cursor:default;">Next →</span>
    {% endif %}
</div>
{% endif %}
