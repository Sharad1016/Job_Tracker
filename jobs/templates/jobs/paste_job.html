{% extends "base_dashboard.html" %}
{% block title %}Add Job{% endblock %}
{% block content %}
<a href="{% url 'job_matches' %}" style="color:var(--text-soft); font-size:14px;">← Back to Job Matches</a>
<h1 style="font-size:24px; margin:16px 0 4px;">Add a Job</h1>
<p style="color:var(--text-soft); margin-bottom:24px;">Paste a full job description — AI will extract the details automatically.</p>

<div class="card" style="max-width:640px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Extract with AI</button>
    </form>
</div>
{% endblock %}
