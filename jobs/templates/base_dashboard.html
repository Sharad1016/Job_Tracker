<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Job Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6D5DFC; --primary-dark: #5B4FE0; --primary-light: #EEEBFF;
            --bg: #F6F6FB; --card: #FFFFFF; --text: #1F2333; --text-soft: #6B7280;
            --border: #E7E7F1; --success-bg: #DCFCE7; --success-text: #16A34A;
            --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
            --shadow: 0 1px 2px rgba(20,20,50,0.04), 0 4px 16px rgba(20,20,50,0.06);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        a { text-decoration: none; color: inherit; }
        .shell { display: flex; min-height: 100vh; }
        .sidebar {
            width: 232px; background: var(--card); border-right: 1px solid var(--border);
            padding: 24px 16px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
            display: flex; flex-direction: column;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 0 8px 24px; }
        .brand-dot { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, var(--primary), #A78BFA); }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 500; color: var(--text-soft); margin-bottom: 2px;
        }
        .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .nav-item:hover:not(.disabled) { background: #F3F3FA; }
        .nav-item.disabled { color: #C3C3D0; cursor: default; }
        .soon-tag { margin-left: auto; font-size: 10px; background: #F0F0F5; color: #9494A6; padding: 2px 6px; border-radius: 999px; }
        .nav-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #B0B0C0; margin: 18px 8px 6px; }
        .sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
        .main { flex: 1; padding: 32px 40px; min-width: 0; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px;
            border: none; cursor: pointer; transition: background .15s ease;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--primary-light); }
        .card { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 24px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-success { background: var(--success-bg); color: var(--success-text); }
        .badge-soft { background: var(--primary-light); color: var(--primary); }
        .alert { padding: 14px 18px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 14px; }
        .alert-success { background: #DCFCE7; color: #166534; }
        .alert-error, .alert-danger { background: #FEE2E2; color: #991B1B; }
        .alert-warning { background: #FEF3C7; color: #92400E; }
        input, textarea, select {
            width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); font-family: inherit; font-size: 14px; background: #FBFBFE;
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
        label { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block; }
        ul.errorlist { color: #DC2626; font-size: 12px; padding-left: 18px; margin: 4px 0; }
    </style>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <a href="{% url 'home' %}" class="brand"><span class="brand-dot"></span> AI Job Tracker</a>

        <a href="{% url 'job_matches' %}" class="nav-item {% if active_nav == 'matches' %}active{% endif %}">🎯 Job Matches</a>
        <a href="{% url 'saved_jobs' %}" class="nav-item {% if active_nav == 'saved' %}active{% endif %}">🔖 Saved Jobs</a>
        <a href="{% url 'applications_applied' %}" class="nav-item {% if active_nav == 'applied' %}active{% endif %}">📨 Applied</a>
        <a href="{% url 'applications_oa' %}" class="nav-item {% if active_nav == 'oa' %}active{% endif %}">📝 Online Assessment</a>
        <a href="{% url 'applications_interview' %}" class="nav-item {% if active_nav == 'interview' %}active{% endif %}">🎤 Interview</a>

        <div class="sidebar-footer">
            <a href="{% url 'profile_edit' %}" class="nav-item {% if active_nav == 'profile' %}active{% endif %}">👤 Profile</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="nav-item" style="border:none; background:none; width:100%; text-align:left; cursor:pointer; font-family:inherit;">🚪 Logout</button>
            </form>
        </div>
    </aside>

    <main class="main">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-danger{% else %}alert-warning{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
