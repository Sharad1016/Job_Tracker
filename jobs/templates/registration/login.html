{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; justify-content:center; gap:56px; flex-wrap:wrap; padding:24px 0;">

    <div style="text-align:center; max-width:280px;">
        <svg viewBox="0 0 200 200" width="220" height="220">
            <rect x="25" y="30" width="150" height="100" rx="12" fill="#EEEBFF"/>
            <circle cx="45" cy="45" r="4" fill="#C7BFFF"/>
            <circle cx="58" cy="45" r="4" fill="#C7BFFF"/>
            <circle cx="71" cy="45" r="4" fill="#C7BFFF"/>
            <rect x="40" y="60" width="60" height="8" rx="4" fill="#C7BFFF"/>
            <rect x="40" y="75" width="90" height="8" rx="4" fill="#DCD7FF"/>
            <circle cx="130" cy="150" r="34" fill="none" stroke="#6D5DFC" stroke-width="6"/>
            <line x1="153" y1="173" x2="172" y2="192" stroke="#6D5DFC" stroke-width="6" stroke-linecap="round"/>
            <rect x="55" y="150" width="34" height="26" rx="4" fill="#6D5DFC"/>
            <rect x="65" y="142" width="14" height="10" rx="3" fill="#6D5DFC"/>
        </svg>
        <p style="font-weight:700; font-size:18px; margin-top:8px;">Find. Track. Match.</p>
        <p style="color:var(--text-soft); font-size:14px;">Let AI help you find and track the right jobs.</p>
    </div>

    <div class="card" style="width:380px;">
        <h1 style="font-size:22px; margin:0 0 4px;">Welcome Back 👋</h1>
        <p style="color:var(--text-soft); font-size:14px; margin-bottom:24px;">Login to continue to your account</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Login</button>
        </form>
        <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-soft);">
            Don't have an account? <a href="{% url 'signup' %}" style="color:var(--primary); font-weight:600;">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
